# Render Blueprint specification for UniTrack Staging API
services:
  - type: web
    name: unitrack-api-staging
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
      - key: APP_BASE_URL
        sync: false
